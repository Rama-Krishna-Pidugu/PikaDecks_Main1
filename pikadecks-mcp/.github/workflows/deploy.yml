name: PikaDecks MCP CI/CD

on:
  push:
    branches:
      - main
      - developer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test and package MCP server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python compile check
        run: python -m compileall app lamda_handler.py

      - name: Run MCP tests
        run: npm test

      - name: Validate Serverless package
        env:
          SLS_TELEMETRY_DISABLED: '1'
          DOCKERIZE_PIP: 'false'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'ci-dummy-access-key' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'ci-dummy-secret-key' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://pikadecks.app,https://chatgpt.com,https://chat.openai.com,https://claude.ai' }}
          PIKADECKS_API_URL: ${{ secrets.PIKADECKS_API_URL || 'https://api.pikadecks.app' }}
          LOG_LEVEL: INFO
        run: npx serverless package --stage ${{ github.ref_name == 'main' && 'prod' || 'test' }}

  deploy-test:
    name: Deploy MCP to test
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref_name == 'developer'
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Check required deployment secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PIKADECKS_API_URL: ${{ secrets.PIKADECKS_API_URL }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || (echo "Missing AWS_ACCESS_KEY_ID secret" && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" || (echo "Missing AWS_SECRET_ACCESS_KEY secret" && exit 1)
          test -n "$PIKADECKS_API_URL" || (echo "Missing PIKADECKS_API_URL secret" && exit 1)

      - name: Deploy test via Serverless
        env:
          SLS_TELEMETRY_DISABLED: '1'
          DOCKERIZE_PIP: 'false'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://pikadecks.app,https://chatgpt.com,https://chat.openai.com,https://claude.ai' }}
          PIKADECKS_API_URL: ${{ secrets.PIKADECKS_API_URL }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL || '' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://pikadecks.app' }}
          MCP_JWT_SECRET: ${{ secrets.MCP_JWT_SECRET || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          LOG_LEVEL: INFO
        run: npm run deploy:test

  deploy-prod:
    name: Deploy MCP to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref_name == 'main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Check required deployment secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PIKADECKS_API_URL: ${{ secrets.PIKADECKS_API_URL }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || (echo "Missing AWS_ACCESS_KEY_ID secret" && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" || (echo "Missing AWS_SECRET_ACCESS_KEY secret" && exit 1)
          test -n "$PIKADECKS_API_URL" || (echo "Missing PIKADECKS_API_URL secret" && exit 1)

      - name: Deploy production via Serverless
        env:
          SLS_TELEMETRY_DISABLED: '1'
          DOCKERIZE_PIP: 'false'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://pikadecks.app,https://chatgpt.com,https://chat.openai.com,https://claude.ai' }}
          PIKADECKS_API_URL: ${{ secrets.PIKADECKS_API_URL }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL || '' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://pikadecks.app' }}
          MCP_JWT_SECRET: ${{ secrets.MCP_JWT_SECRET || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          LOG_LEVEL: INFO
        run: npm run deploy:prod
