name: EAS Android Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  ci:
    name: Test frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm test

  build_and_submit:
    name: Build and submit Android production
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and submit Android app
        env:
          EXPO_PUBLIC_APP_ENV: internal-testing
          EXPO_PUBLIC_API_URL: https://zxd2zncyzh.execute-api.ap-south-1.amazonaws.com
        run: eas build --platform android --profile production --auto-submit --non-interactive
